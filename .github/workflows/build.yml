name: Maven CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'adopt'
          cache: 'maven'
          cache-dependency-path: '/Proyect/hoteles/pom.xml'
      - name: Build with Maven
        run: mvn clean package
        working-directory:  Proyect/hoteles
