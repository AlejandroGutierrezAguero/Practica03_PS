<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" 
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:h="http://xmlns.jcp.org/jsf/html">

<h:head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Disponibilidad de Habitaciones</title>
</h:head>

<h:body>
    <h1 style="color:blue">Disponibilidad de Habitaciones</h1>

    <h:form>
        <h:dataTable value="#{reservasBean.habitacionesDisponibles}" var="hab"
                     border="1" cellpadding="4" cellspacing="0">
            <h:column>
                <f:facet name="header">
                    <h:outputText value="Tipo de Habitación" />
                </f:facet>
                <h:outputText value="#{hab.habitacion.tipo}" />
            </h:column>

            <h:column>
                <f:facet name="header">
                    <h:outputText value="Disponibles" />
                </f:facet>
                <h:outputText value="#{hab.cantidad}" />
            </h:column>

            <h:column>
                <f:facet name="header">
                    <h:outputText value="Precio de la Habitacion" />
                </f:facet>
                <h:outputText value="#{hab.habitacion.precioPorNoche}" />
            </h:column>

            <h:column>
                <f:facet name="header">
                    <h:outputText value="Número de habitaciones" />
                </f:facet>
                <h:inputText value="#{reservasBean.cantidadesSolicitadas[hab.habitacion.idHabitacion]}" 
                             converterMessage="Debes introducir un número entero válido." />
            </h:column>
        </h:dataTable>

        <h:commandButton value="Reservar" action="#{reservasBean.doReservar}" />
        <h:button value="Volver" outcome="listaHoteles.xhtml" />
        
        <h:messages style="color:red" showDetail="true" showSummary="false" />
    </h:form>

    <hr/>
</h:body>

</html>
